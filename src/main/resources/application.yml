spring:
  application:
    name: flood-situation-platform
  datasource:
    url: jdbc:mysql://${FLOOD_DB_HOST:127.0.0.1}:${FLOOD_DB_PORT:3306}/${FLOOD_DB_NAME:flood_scenario_deduction}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
    username: ${FLOOD_DB_USERNAME:root}
    password: ${FLOOD_DB_PASSWORD:}
    hikari:
      connection-init-sql: SET time_zone = '+00:00'
  flyway:
    enabled: true
    locations: classpath:sql/mysql
    validate-on-migrate: true
  jackson:
    time-zone: UTC
    property-naming-strategy: LOWER_CAMEL_CASE

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health

server:
  error:
    include-message: never
